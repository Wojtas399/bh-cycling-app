# Runs the e2e suite on Expo Simulators for PRs from rc/* to main, and on
# demand. Informational: nothing requires these jobs. docs/e2e.md has the
# details.
#
# Run by hand:
#   npx eas-cli@latest workflow:run .eas/workflows/e2e.yml -F platform=both

name: E2E

on:
  pull_request:
    branches: ['main']
    if: ${{ startsWith(github.event.pull_request.head.ref, 'rc/') }}
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Which platforms to build and test
        options: [both, ios, android]
        default: both

defaults:
  tools:
    node: '24'

# Every run reseeds the same test athlete, so only one runs at a time.
concurrency:
  group: e2e
  cancel_in_progress: true

jobs:
  build_ios:
    name: E2E Build iOS
    # A PR run has no inputs, so it builds both platforms.
    if: ${{ inputs.platform != 'android' }}
    type: build
    params:
      platform: ios
      profile: e2e

  build_android:
    name: E2E Build Android
    if: ${{ inputs.platform != 'ios' }}
    type: build
    params:
      platform: android
      profile: e2e

  seed:
    name: E2E Seed
    runs_on: linux-medium
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Check the replay cache for secrets
        run: npm run e2e:check-cache
      - name: Seed the test athlete
        run: npm run e2e:seed

  test_ios:
    name: E2E iOS
    needs: [build_ios, seed]
    runs_on: linux-medium
    environment: development
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      # Not EAS_BUILD_ID, which EAS sets to this job's own id.
      E2E_IOS_BUILD_ID: ${{ needs.build_ios.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Log the timezone and date
        run: |
          echo "Timezone: $(node -p 'Intl.DateTimeFormat().resolvedOptions().timeZone') (UTC$(date +%z))"
          echo "Date: $(date '+%Y-%m-%d %H:%M:%S')"
      - name: Run the suite
        run: npx e2e run --target ios --reporter list,junit --video=retain-on-failure --retries 1
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-ios
          path: .e2e

  test_android:
    name: E2E Android
    needs: [build_android, seed]
    runs_on: linux-medium
    environment: development
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_ANDROID_BUILD_ID: ${{ needs.build_android.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Log the timezone and date
        run: |
          echo "Timezone: $(node -p 'Intl.DateTimeFormat().resolvedOptions().timeZone') (UTC$(date +%z))"
          echo "Date: $(date '+%Y-%m-%d %H:%M:%S')"
      - name: Run the suite
        run: npx e2e run --target android --reporter list,junit --video=retain-on-failure --retries 1
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-android
          path: .e2e
