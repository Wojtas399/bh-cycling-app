# Runs CI, then scripts/release.sh per platform. The ref decides what ships.
# See "Releasing" in README.md.

name: Release

on:
  push:
    branches:
      - main
      - 'rc/*'
      - 'hotfix/*'
    tags:
      - 'v*'

defaults:
  tools:
    node: '24'

# Releases of one ref queue rather than cancel, so a push never aborts a store
# build halfway.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  ci:
    name: CI
    uses: ./.eas/workflows/ci.yml

  release_ios:
    name: Release iOS
    needs: [ci]
    # Tags ship to production. Branches ship Dev or staging, whose variables
    # live in development. Matching release.sh keeps the other environment's
    # variables out of the job.
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Release
        run: scripts/release.sh ios

  release_android:
    name: Release Android
    needs: [ci]
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Release
        run: scripts/release.sh android
