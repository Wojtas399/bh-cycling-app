name: CI

on:
  workflow_call:
  pull_request:

# A new push to a PR cancels its older run. Calls from release.yml get their
# own group, so a release never cancels its checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # One job, so `npm ci` runs once per run. GitHub bills each job rounded up
  # to the minute.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - run: npm run lint

      - if: ${{ !cancelled() }}
        run: npx prettier --check .

      - if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - if: ${{ !cancelled() }}
        run: npm test -- --ci

      - if: ${{ !cancelled() }}
        run: npx tsc --noEmit
        working-directory: functions

      - if: ${{ !cancelled() }}
        run: npx jest --ci
        working-directory: functions
