name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts: they're still being filled in, so the review would flag
    # unfinished work. Runs again on `ready_for_review` and every push after.
    if: github.event.pull_request.draft == false

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'mattpocock-skills@claude-plugins-official'
          prompt: |
            /mattpocock-skills:code-review

            Review PR #${{ github.event.pull_request.number }} against its base branch `origin/${{ github.event.pull_request.base.ref }}`.

            Keep a single review comment per PR, updated in place on each run:
            1. Start the comment body with the exact line `<!-- claude-code-review -->`.
            2. Look up an existing one:
               `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100 --jq '[.[] | select(.body | startswith("<!-- claude-code-review -->"))] | last | .id // empty'`
            3. If that prints an id, replace its body:
               `gh api --method PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="..."`
               Otherwise create it with `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
            Only post a GitHub comment - don't submit the review as a message.
          claude_args: '--allowedTools "Bash(gh:*),Bash(git:*),Agent,Read,Grep,Glob"'
          # Temporary: surface the denied tool call that stopped the review. Remove once the comment posts.
          show_full_output: true

