name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            Review the changes in pull request #${{ github.event.pull_request.number }} of this repository.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the changed files and diffs.
            2. Analyze the changes for bugs, security issues, code style, and improvements.
            3. Post your review as a PR comment using:
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            Keep feedback actionable and specific. Reference file paths and line numbers where relevant.
          claude_args: '--allowedTools Bash(gh *)'

