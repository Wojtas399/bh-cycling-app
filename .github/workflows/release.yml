name: Release

on:
  push:
    branches:
      - 'rc/*'
      - 'hotfix/*'
    tags:
      - 'v*'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release ${{ matrix.platform }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    concurrency:
      group: release-${{ github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: scripts/release.sh ${{ matrix.platform }}
